{% extends "base.html" %}

{% block content %}

<h3>My Files</h3>

<p>
<a href="{% url 'upload' %}">
Upload New File
</a>
</p>

<table border="1" cellpadding="10">

<tr>

<th>Name</th>

<th>Uploaded</th>

<th>Action</th>

</tr>

{% for file in files %}

<tr>

<td>{{ file.original_filename }}</td>

<td>{{ file.uploaded_at }}</td>

<td>

<a href="{% url 'download' file.id %}">
    Download
</a>

|

<a href="{% url 'delete' file.id %}">
Delete
</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="3">
No files uploaded.
</td>

</tr>

{% endfor %}

</table>

{% endblock %}
